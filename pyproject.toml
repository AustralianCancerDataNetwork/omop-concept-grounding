[project]
name = "omop-concept-grounding"
dynamic = ["version"]
description = "Agent-facing instructions and contracts for verified OMOP concept grounding."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ohdsi-prompt-registry>=0.3,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.4",
  "ty>=0.0.59",
]

[project.entry-points."ohdsi_prompt_registry.packs"]
omop_concept_grounding = "omop_concept_grounding.packs"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { tag_regex = '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$' }

[tool.hatch.build.targets.wheel]
packages = ["src/omop_concept_grounding"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
constraint-dependencies = ["setuptools>=83.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
# Pinned explicitly: ruff's implicit default rule set widens between releases
# (0.16 pulled in flake8-bandit, flake8-blind-except and friends), which would
# otherwise break CI on a ruff upgrade rather than on a code change.
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]

[tool.ty.src]
include = ["src"]
